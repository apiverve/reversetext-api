[project]
name = "apiverve-reversetext"
version = "1.2.2"
authors = [
  { name="APIVerve", email="hello@apiverve.com" },
]
description = "Reverse Text transforms text by reversing characters, words, or lines with multiple reversal modes for different use cases."
keywords = ["reverse text", "text reversal", "backwards text", "flip text", "reverse string"]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "requests>=2.25.0"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Natural Language :: English",
]

[project.urls]
Homepage = "https://apiverve.com/marketplace/reversetext?utm_source=pypi&utm_medium=referral&utm_content=homepage"
Documentation = "https://docs.apiverve.com/ref/reversetext?utm_source=pypi&utm_medium=referral&utm_content=docs"
Repository = "https://github.com/apiverve/reversetext-api"
Twitter = "https://twitter.com/apivervehq"
